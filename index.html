<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CC Irunés · Suite de aplicaciones</title>
<link rel="icon" href="https://app.ccirunes.com/icon-512-maskable.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0d1b3e;
  --navy-deep:#081228;
  --navy-line:#1e3160;
  --blue:#3b82f6;
  --blue-soft:#93b4f5;
  --ink:#eef2fb;
  --muted:#8ea0c7;
  --canvas:#f5f6f9;
  --sidebar-w:250px;
  --sidebar-w-collapsed:62px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'DM Sans',system-ui,sans-serif;
  background:var(--canvas);
  display:flex;
  overflow:hidden;
}

/* ---------- SIDEBAR ---------- */
#sidebar{
  width:var(--sidebar-w);
  flex:0 0 var(--sidebar-w);
  background:var(--navy);
  color:var(--ink);
  display:flex;
  flex-direction:column;
  border-right:1px solid var(--navy-line);
  transition:width .18s ease,flex-basis .18s ease;
}
body.collapsed #sidebar{width:var(--sidebar-w-collapsed);flex-basis:var(--sidebar-w-collapsed)}

.brand{
  display:flex;align-items:center;gap:10px;
  padding:16px 14px;
  border-bottom:1px solid var(--navy-line);
  cursor:pointer;
}
.brand img{width:30px;height:30px;border-radius:6px;flex:0 0 30px}
.brand-txt h1{font-family:'Playfair Display',serif;font-size:15px;letter-spacing:.06em;line-height:1.1}
.brand-txt span{font-size:9px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}

.clock{
  padding:12px 16px;
  border-bottom:1px solid var(--navy-line);
}
.clock strong{font-family:'DM Mono',monospace;font-size:20px;letter-spacing:.06em;display:block}
.clock span{font-size:9.5px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}

nav{flex:1;overflow-y:auto;padding:10px 0}
nav h2{
  font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);padding:14px 16px 6px;font-weight:500;
}
nav a{
  display:flex;align-items:center;gap:11px;
  padding:8px 16px;
  color:var(--ink);text-decoration:none;
  font-size:13.5px;
  border-left:3px solid transparent;
  white-space:nowrap;
}
nav a:hover{background:rgba(59,130,246,.14)}
nav a.active{background:rgba(59,130,246,.2);border-left-color:var(--blue);color:#fff;font-weight:500}
nav a .ico{width:20px;text-align:center;font-size:15px;flex:0 0 20px}

.toggle{
  border:none;background:none;color:var(--muted);
  font-family:inherit;font-size:12px;
  display:flex;align-items:center;gap:10px;
  padding:12px 16px;cursor:pointer;
  border-top:1px solid var(--navy-line);
  white-space:nowrap;
}
.toggle:hover{color:var(--ink)}
body.collapsed .brand-txt,
body.collapsed .clock,
body.collapsed nav h2,
body.collapsed nav a span:not(.ico),
body.collapsed .toggle span{display:none}
body.collapsed nav a{justify-content:center;padding:10px 0}

/* ---------- MAIN ---------- */
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#crumb{
  height:44px;flex:0 0 44px;
  display:flex;align-items:center;gap:9px;
  padding:0 20px;
  background:#fff;border-bottom:1px solid #e3e6ee;
  font-size:11px;letter-spacing:.13em;text-transform:uppercase;
}
#crumb b{color:var(--navy);font-weight:700}
#crumb i{color:#c3c8d6;font-style:normal}
#crumb em{color:var(--blue);font-style:normal;font-weight:500}
#crumb .ext{
  margin-left:auto;font-size:11px;letter-spacing:.06em;text-transform:none;
  color:var(--blue);text-decoration:none;
}
#crumb .ext:hover{text-decoration:underline}

#stage{flex:1;position:relative;background:var(--canvas)}
#frame{width:100%;height:100%;border:0;display:none;background:#fff}
#frame.on{display:block}

/* ---------- HOME ---------- */
#home{
  position:absolute;inset:0;overflow-y:auto;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px 24px;
}
#home img{width:74px;margin-bottom:20px}
#home h2{font-family:'Playfair Display',serif;font-size:40px;color:var(--navy);letter-spacing:.02em}
#home p{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#8b93a8;margin:10px 0 30px}
.grid{
  display:grid;gap:14px;width:100%;max-width:860px;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
}
.card{
  background:#fff;border:1px solid #dfe4f0;border-left:3px solid var(--blue);
  border-radius:4px;padding:16px;cursor:pointer;text-align:left;
  font-family:inherit;transition:transform .12s,box-shadow .12s;
}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(13,27,62,.1)}
.card .ico{font-size:20px;display:block;margin-bottom:12px}
.card b{display:block;font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--navy)}
.card small{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--blue-soft);color:#7f93c4}

/* ---------- MÓVIL: sin iframe ---------- */
#burger{display:none}
@media(max-width:820px){
  #sidebar{
    position:fixed;inset:0 auto 0 0;z-index:50;
    transform:translateX(-100%);transition:transform .2s ease;
  }
  body.menu #sidebar{transform:none}
  #burger{
    display:block;border:none;background:none;font-size:19px;
    color:var(--navy);cursor:pointer;padding:0 4px 0 0;
  }
  #home h2{font-size:28px}
}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<aside id="sidebar">
  <div class="brand" onclick="go('')">
    <img src="https://app.ccirunes.com/icon-512-maskable.png" alt="">
    <div class="brand-txt"><h1>CC IRUNÉS</h1><span>Suite de aplicaciones</span></div>
  </div>
  <div class="clock"><strong id="hora">--:--:--</strong><span id="fecha"></span></div>
  <nav id="nav"></nav>
  <button class="toggle" onclick="document.body.classList.toggle('collapsed')">◀ <span>Contraer menú</span></button>
</aside>

<div id="main">
  <div id="crumb">
    <button id="burger" onclick="document.body.classList.toggle('menu')">☰</button>
    <b>CC IRUNÉS</b><i>/</i><em id="crumbApp">INICIO</em>
    <a class="ext" id="ext" href="#" target="_blank" rel="noopener" style="display:none">Abrir en pestaña nueva ↗</a>
  </div>
  <div id="stage">
    <iframe id="frame" title="Aplicación" allow="clipboard-read; clipboard-write" allowfullscreen></iframe>
    <div id="home">
      <img src="https://app.ccirunes.com/icon-512-maskable.png" alt="">
      <h2>Club Ciclista Irunés</h2>
      <p>Selecciona una aplicación</p>
      <div class="grid" id="grid"></div>
    </div>
  </div>
</div>

<script>
/* ===== ÚNICA ZONA A EDITAR ===== */
const APPS = [
  {sec:'Sociedad Gastronómica', items:[
    {id:'reservas',    n:'Reserva de mesas', ico:'🍽️', url:'https://reservas.ccirunes.com'},
    {id:'notas',       n:'Notas de gasto',   ico:'🧾', url:'https://notas.ccirunes.com'},
  ]},
  {sec:'Club / Escuela', items:[
    {id:'corredores',  n:'Corredores',   ico:'🚴', url:'https://corredores.ccirunes.com'},
    {id:'licencias',   n:'Licencias',    ico:'🪪', url:'https://licencias.ccirunes.com'},
    {id:'tecnicos',    n:'Técnicos',     ico:'📋', url:'https://tecnicos.ccirunes.com'},
    {id:'dossier',     n:'Dossier',      ico:'📕', url:'https://dossier.ccirunes.com'},
    {id:'subvenciones',n:'Subvenciones', ico:'🏛️', url:'https://subvenciones.ccirunes.com'},
    {id:'vehiculos',   n:'Vehículos',    ico:'🚐', url:'https://vehiculos.ccirunes.com'},
  ]},
  {sec:'Administración', items:[
    {id:'contabilidad',n:'Contabilidad', ico:'📊', url:'https://contabilidad.ccirunes.com'},
    {id:'facturas',    n:'Facturas',     ico:'🧮', url:'https://facturas.ccirunes.com'},
    {id:'socios',      n:'Socios',       ico:'👥', url:'https://socios.ccirunes.com'},
    {id:'sociedad',    n:'Sociedad',     ico:'🍷', url:'https://sociedad.ccirunes.com'},
  ]},
];
/* =============================== */

const FLAT = APPS.flatMap(g => g.items);
const esMovil = () => window.matchMedia('(max-width:820px)').matches;

// menú lateral
document.getElementById('nav').innerHTML = APPS.map(g =>
  `<h2>${g.sec}</h2>` + g.items.map(a =>
    `<a href="#${a.id}" data-id="${a.id}" title="${a.n}"><span class="ico">${a.ico}</span><span>${a.n}</span></a>`
  ).join('')
).join('');

// tarjetas del inicio
document.getElementById('grid').innerHTML = APPS.flatMap(g =>
  g.items.map(a =>
    `<button class="card" onclick="go('${a.id}')">
       <span class="ico">${a.ico}</span><b>${a.n}</b><small>${g.sec}</small>
     </button>`)
).join('');

function go(id){ location.hash = id ? '#'+id : ''; if(esMovil()) document.body.classList.remove('menu'); }

function render(){
  const id = location.hash.slice(1);
  const app = FLAT.find(a => a.id === id);
  const frame = document.getElementById('frame');
  const ext = document.getElementById('ext');

  document.querySelectorAll('#nav a').forEach(a =>
    a.classList.toggle('active', a.dataset.id === id));

  if(!app){
    frame.classList.remove('on'); frame.src = 'about:blank';
    document.getElementById('home').style.display = 'flex';
    document.getElementById('crumbApp').textContent = 'INICIO';
    ext.style.display = 'none';
    return;
  }

  document.getElementById('crumbApp').textContent = app.n.toUpperCase();
  ext.href = app.url; ext.style.display = 'inline';

  // En móvil el iframe no compensa: se abre la app entera.
  if(esMovil()){ location.replace(app.url); return; }

  document.getElementById('home').style.display = 'none';
  frame.src = app.url; frame.classList.add('on');
}
addEventListener('hashchange', render);

function reloj(){
  const d = new Date();
  document.getElementById('hora').textContent = d.toLocaleTimeString('es-ES');
  document.getElementById('fecha').textContent =
    d.toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'});
}
setInterval(reloj,1000); reloj(); render();
</script>
</body>
</html>
